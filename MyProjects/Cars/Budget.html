<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars - Personality Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #050b1a, #0a1430, #111c3a);
            color: white;
            font-family: Arial;
        }

        .container {
            margin-top: 40px;
        }

        .card-box {
            background: rgba(255, 255, 255, 0.07);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        select, button {
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00e5ff, #3b82f6, #a855f7);
            border: none;
            color: black;
            font-weight: bold;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 229, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container text-center">

        <h1>🚗 Car Personality Quiz</h1>
        <p>Find your perfect car match 🔥</p>

        <div class="card-box">

            <select id="budget" class="form-control">
                <option value="">Select Budget</option>
                <option value="low">Low</option>
                <option value="mid">Mid</option>
                <option value="high">High</option>
            </select>

            <select id="style" class="form-control">
                <option value="">Select Style</option>
                <option value="sport">Sport</option>
                <option value="luxury">Luxury</option>
                <option value="simple">Simple</option>
                <option value="tech">Tech</option>
            </select>

            <select id="usage" class="form-control">
                <option value="">Select Usage</option>
                <option value="speed">Speed</option>
                <option value="family">Family</option>
                <option value="daily">Daily</option>
            </select>

            <button class="btn btn-primary w-100 mt-3" onclick="getCarPersonality()">
                🎯 Get My Car Match
            </button>

            <div id="quizResult" class="result-box"></div>

        </div>
    </div>

    <script>

        const cars = [
            { name: "BMW M4", type: "sport", usage: "speed" },
            { name: "Bugatti Chiron", type: "super", usage: "speed" },
            { name: "Audi R8", type: "sport", usage: "speed" },
            { name: "Mercedes S-Class", type: "luxury", usage: "family" },
            { name: "Rolls Royce Phantom", type: "luxury", usage: "family" },
            { name: "Lamborghini Huracan", type: "sport", usage: "speed" },
            { name: "Tesla Model S", type: "tech", usage: "daily" },
            { name: "Porsche 911", type: "sport", usage: "speed" }
        ];

        function getCarPersonality() {

            let budget = document.getElementById("budget").value;
            let style = document.getElementById("style").value;
            let usage = document.getElementById("usage").value;

            if (!budget || !style || !usage) {
                alert("Please select all options!");
                return;
            }

            let personality = "";
            let matchedCars = [];

            if (style === "sport" && usage === "speed") {
                personality = "🚗 You are a SPORTS CAR PERSON 🔥";
            }
            else if (style === "luxury") {
                personality = "👑 You are a LUXURY CAR PERSON";
            }
            else if (style === "tech") {
                personality = "⚡ You are a TECH LOVER DRIVER";
            }
            else if (style === "simple") {
                personality = "🚙 You are a PRACTICAL DRIVER";
            }
            else {
                personality = "🚘 You are a BALANCED DRIVER";
            }

            for (let i = 0; i < cars.length; i++) {

                if (
                    (style === cars[i].type || style === "simple") &&
                    (usage === cars[i].usage || usage === "daily")
                ) {
                    matchedCars.push(cars[i].name);
                }
            }

            document.getElementById("quizResult").innerHTML = `
                <h3>${personality}</h3>
                <hr>
                <h5>🚗 Recommended Cars:</h5>
                <p>${matchedCars.length ? matchedCars.join(" | ") : "No exact match, but all luxury cars fit you!"}</p>
            `;
        }

    </script>

</body>

</html>
