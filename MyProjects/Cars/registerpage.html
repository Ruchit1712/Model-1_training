<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .register-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);
        }

        .register-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #0f172a;
        }

        .car-icon {
            font-size: 45px;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-register {
            background: #0f172a;
            color: white;
            border-radius: 10px;
            padding: 10px;
            transition: 0.3s;
        }

        .btn-register:hover {
            background: #334155;
            color: white;
        }

        .valid-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: #16a34a;
            font-size: 1.2rem;
            display: none;
        }

        .position-relative {
            position: relative;
        }

        .bottom-text {
            text-align: center;
            margin-top: 15px;
        }

        .bottom-text a {
            text-decoration: none;
            font-weight: bold;
            color: #0f172a;
        }
    </style>
</head>

<body>

    <div class="register-box">

        
        <h2>Create Account</h2>

        <form id="registerForm" novalidate>

            <div class="mb-3 position-relative">
                <label>Full Name</label>
                <input id="nameInput" type="text" class="form-control" placeholder="Enter your full name" required>
                <span class="valid-icon" id="nameValid">✓</span>
            </div>

            <div class="mb-3 position-relative">
                <label>Email Address</label>
                <input id="emailInput" type="email" class="form-control" placeholder="Enter your email" required>
                <span class="valid-icon" id="emailValid">✓</span>
            </div>

            <div class="mb-3 position-relative">
                <label>Phone Number</label>
                <input id="phoneInput" type="tel" class="form-control" placeholder="Enter your phone number" pattern="\d{10}" required>
                <span class="valid-icon" id="phoneValid">✓</span>
            </div>

            <div class="mb-3 position-relative">
                <label>Password</label>
                <input id="passwordInput" type="password" class="form-control" placeholder="Create password" minlength="6" required>
                <span class="valid-icon" id="passwordValid">✓</span>
            </div>

            <div class="mb-3 position-relative">
                <label>Confirm Password</label>
                <input id="confirmInput" type="password" class="form-control" placeholder="Confirm password" required>
                <span class="valid-icon" id="confirmValid">✓</span>
            </div>

            <button type="submit" class="btn btn-register w-100">
                Register
            </button>

            <div id="registerFeedback" class="text-success text-center mt-3" style="display:none;">
                Registration complete ✓ Redirecting to login...
            </div>

        </form>

        <div class="bottom-text">
            Already have an account?
            <a href="Login.html">Login</a>
        </div>

    </div>

    <script>
        const form = document.getElementById('registerForm');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const phoneInput = document.getElementById('phoneInput');
        const passwordInput = document.getElementById('passwordInput');
        const confirmInput = document.getElementById('confirmInput');
        const nameValid = document.getElementById('nameValid');
        const emailValid = document.getElementById('emailValid');
        const phoneValid = document.getElementById('phoneValid');
        const passwordValid = document.getElementById('passwordValid');
        const confirmValid = document.getElementById('confirmValid');
        const feedback = document.getElementById('registerFeedback');

        function updateIcon(input, icon) {
            if (input.checkValidity() && input.value.trim() !== '') {
                icon.style.display = 'inline';
            } else {
                icon.style.display = 'none';
            }
        }

        function validatePasswords() {
            const valid = passwordInput.value && confirmInput.value && passwordInput.value === confirmInput.value;
            if (valid) {
                confirmInput.setCustomValidity('');
            } else {
                confirmInput.setCustomValidity('Passwords do not match');
            }
            updateIcon(passwordInput, passwordValid);
            updateIcon(confirmInput, confirmValid);
            return valid;
        }

        nameInput.addEventListener('input', () => updateIcon(nameInput, nameValid));
        emailInput.addEventListener('input', () => updateIcon(emailInput, emailValid));
        phoneInput.addEventListener('input', () => updateIcon(phoneInput, phoneValid));
        passwordInput.addEventListener('input', () => validatePasswords());
        confirmInput.addEventListener('input', () => validatePasswords());

        form.addEventListener('submit', event => {
            event.preventDefault();
            validatePasswords();
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                updateIcon(nameInput, nameValid);
                updateIcon(emailInput, emailValid);
                updateIcon(phoneInput, phoneValid);
                updateIcon(passwordInput, passwordValid);
                updateIcon(confirmInput, confirmValid);
                return;
            }

            nameValid.style.display = 'inline';
            emailValid.style.display = 'inline';
            phoneValid.style.display = 'inline';
            passwordValid.style.display = 'inline';
            confirmValid.style.display = 'inline';
            feedback.style.display = 'block';
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.textContent = 'Registering...';
            submitButton.disabled = true;

            setTimeout(() => {
                window.location.href = 'Login.html';
            }, 1200);
        });
    </script>

</body>

</html>
