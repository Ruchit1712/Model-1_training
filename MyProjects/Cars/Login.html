<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #111827, #1f2937);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #111827;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-login {
            background: #111827;
            color: white;
            border-radius: 10px;
            padding: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #374151;
        }

        .valid-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: #16a34a;
            font-size: 1.2rem;
            display: none;
        }

        .car-icon {
            font-size: 45px;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 15px;
        }

        .bottom-text a {
            text-decoration: none;
            color: #111827;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">



        <h2>Car Store Login</h2>

        <form id="loginForm" novalidate>

            <div class="mb-3">
                <label>Email Address</label>
                <div class="position-relative">
                    <input id="emailInput" type="email" class="form-control" placeholder="Enter your email" required>
                    <span class="valid-icon" id="emailValid">✓</span>
                </div>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <div class="position-relative">
                    <input id="passwordInput" type="password" class="form-control" placeholder="Enter your password" required>
                    <span class="valid-icon" id="passwordValid">✓</span>
                </div>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <div>
                    <input type="checkbox">
                    <label>Remember me</label>
                </div>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-login w-100">
                Login
            </button>

            <div id="loginFeedback" class="text-success text-center mt-3" style="display:none;">
                All details are complete ✓ Logging in and redirecting to home...
            </div>

        </form>

        <div class="bottom-text">
            Don't have an account?
            <a href="C:\Users\DELL\OneDrive\Desktop\OJT TRAINING\Bootstap & Tailwind css\Cars\registerpage.html">Register</a>
        </div>

    </div>

    <script>
        const form = document.getElementById('loginForm');
        const email = document.getElementById('emailInput');
        const password = document.getElementById('passwordInput');
        const emailValid = document.getElementById('emailValid');
        const passwordValid = document.getElementById('passwordValid');
        const feedback = document.getElementById('loginFeedback');

        function updateIcon(input, icon) {
            if (input.checkValidity() && input.value.trim() !== '') {
                icon.style.display = 'inline';
            } else {
                icon.style.display = 'none';
            }
        }

        email.addEventListener('input', () => updateIcon(email, emailValid));
        password.addEventListener('input', () => updateIcon(password, passwordValid));

        form.addEventListener('submit', event => {
            event.preventDefault();
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                updateIcon(email, emailValid);
                updateIcon(password, passwordValid);
                return;
            }

            emailValid.style.display = 'inline';
            passwordValid.style.display = 'inline';
            feedback.style.display = 'block';
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.textContent = 'Logging in...';
            submitButton.disabled = true;

            setTimeout(() => {
                window.location.href = 'cars.html';
            }, 1200);
        });
    </script>

</body>

</html>
